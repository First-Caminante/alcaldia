<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="100%" height="100%" role="img" aria-label="Escudo Oficial del Gobierno Autónomo Municipal de Pelechuco">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="60%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="fieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="60%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="shieldShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
    <clipPath id="shieldClip">
      <path d="M 40,40 L 200,40 Q 200,160 120,230 Q 40,160 40,40 Z"/>
    </clipPath>
  </defs>

  <!-- Cóndor de los Andes superior -->
  <g id="condor" transform="translate(120, 28)">
    <!-- Alas -->
    <path d="M -8,-5 C -30,-20 -70,-15 -85,5 C -65,2 -40,-2 -25,2 C -45,12 -65,20 -75,32 C -50,22 -30,16 -12,14 L 0,16 L 12,14 C 30,16 50,22 75,32 C 65,20 45,12 25,2 C 40,-2 65,2 85,5 C 70,-15 30,-20 8,-5 Z" fill="#334155"/>
    <!-- Detalles alas doradas -->
    <path d="M -5,-3 C -25,-12 -55,-8 -68,3 C -50,2 -30,-1 -18,2 C -32,9 -48,15 -56,22 C -38,15 -22,11 -8,10 Z" fill="#475569"/>
    <path d="M 5,-3 C 25,-12 55,-8 68,3 C 50,2 30,-1 18,2 C 32,9 48,15 56,22 C 38,15 22,11 8,10 Z" fill="#475569"/>
    <!-- Cuello con golilla blanca -->
    <ellipse cx="0" cy="1" rx="8" ry="4" fill="#f8fafc"/>
    <!-- Cabeza y pico -->
    <circle cx="0" cy="-6" r="6" fill="#475569"/>
    <path d="M -2,-8 L 4,-8 L 8,-5 L 3,-4 Z" fill="#f59e0b"/>
  </g>

  <!-- Escudo Central con Sombra -->
  <path d="M 40,40 L 200,40 Q 200,160 120,230 Q 40,160 40,40 Z" fill="none" stroke="url(#goldGrad)" stroke-width="8" filter="url(#shieldShadow)"/>
  
  <!-- Contenido recortado del escudo -->
  <g clip-path="url(#shieldClip)">
    <!-- Cielo -->
    <rect x="35" y="35" width="170" height="200" fill="url(#skyGrad)"/>
    
    <!-- Sol Andino Naciente -->
    <circle cx="120" cy="72" r="22" fill="url(#sunGrad)"/>
    <!-- Rayos del Sol -->
    <g stroke="#fde047" stroke-width="2" stroke-linecap="round" opacity="0.85">
      <line x1="120" y1="44" x2="120" y2="38"/>
      <line x1="102" y1="52" x2="97" y2="47"/>
      <line x1="138" y1="52" x2="143" y2="47"/>
      <line x1="94" y1="72" x2="88" y2="72"/>
      <line x1="146" y1="72" x2="152" y2="72"/>
    </g>

    <!-- Nevados de Apolobamba (Katantica y Akamani) -->
    <!-- Montaña fondo izquierda -->
    <polygon points="50,130 90,75 130,130" fill="url(#mountainGrad)"/>
    <polygon points="90,75 80,95 90,92 100,98 105,92 90,75" fill="#ffffff"/>
    
    <!-- Montaña principal centro (Nevado Katantica) -->
    <polygon points="80,140 120,65 170,140" fill="url(#mountainGrad)"/>
    <polygon points="120,65 108,90 120,86 132,92 140,84 120,65" fill="#ffffff"/>
    
    <!-- Montaña derecha -->
    <polygon points="140,140 175,80 205,140" fill="url(#mountainGrad)"/>
    <polygon points="175,80 166,98 178,95 186,102 175,80" fill="#ffffff"/>

    <!-- Pradera Andina Verde / Valle de Apolobamba -->
    <path d="M 35,135 Q 80,120 120,132 T 205,130 L 205,235 L 35,235 Z" fill="url(#fieldGrad)"/>
    
    <!-- Río de montaña / Agua cristalina -->
    <path d="M 120,132 C 115,145 130,165 110,185 C 95,200 120,220 115,235 L 125,235 C 135,215 110,195 125,180 C 145,160 125,140 122,132 Z" fill="#38bdf8"/>

    <!-- Silueta Vicuña / Alpaca Andina (Símbolo de Ulla Ulla) -->
    <g transform="translate(68, 155) scale(0.65)">
      <!-- Cuerpo -->
      <ellipse cx="25" cy="20" rx="14" ry="9" fill="#92400e"/>
      <!-- Patas -->
      <rect x="15" y="24" width="2.5" height="18" rx="1" fill="#78350f"/>
      <rect x="20" y="24" width="2" height="17" rx="1" fill="#92400e"/>
      <rect x="30" y="24" width="2.5" height="18" rx="1" fill="#78350f"/>
      <rect x="35" y="24" width="2" height="17" rx="1" fill="#92400e"/>
      <!-- Cuello y Cabeza -->
      <path d="M 32,18 C 34,14 36,8 36,4 C 36,1 39,0 42,2 C 43,4 40,6 40,8 C 39,12 37,16 36,18 Z" fill="#92400e"/>
      <polygon points="42,2 45,3 41,5" fill="#78350f"/>
      <!-- Orejas -->
      <polygon points="38,0 40,3 37,3" fill="#78350f"/>
      <!-- Cola -->
      <path d="M 13,16 C 11,18 10,22 12,23" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Flor de la Cantuta / Riqueza natural -->
    <g transform="translate(152, 168) scale(0.55)">
      <circle cx="8" cy="8" r="4" fill="#dc2626"/>
      <circle cx="16" cy="8" r="4" fill="#eab308"/>
      <circle cx="12" cy="14" r="4" fill="#16a34a"/>
      <path d="M 12,18 Q 14,26 12,32" stroke="#15803d" stroke-width="2"/>
    </g>
  </g>

  <!-- Borde interior dorado ornamental -->
  <path d="M 46,46 L 194,46 Q 194,156 120,222 Q 46,156 46,46 Z" fill="none" stroke="#fef08a" stroke-width="1.5" opacity="0.8"/>

  <!-- Cinta tricolor boliviana y paceña en la base -->
  <g transform="translate(120, 238)">
    <!-- Listón Rojo Amarillo Verde -->
    <path d="M -75,-6 Q 0,-18 75,-6 L 80,10 Q 0,-2 -80,10 Z" fill="#dc2626"/>
    <path d="M -73,0 Q 0,-12 73,0 L 76,6 Q 0,-6 -76,6 Z" fill="#eab308"/>
    <path d="M -75,6 Q 0,-6 75,6 L 72,12 Q 0,0 -72,12 Z" fill="#16a34a"/>
    <!-- Texto de la cinta -->
    <text x="0" y="8" font-family="'Inter', sans-serif" font-size="7.5" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">PELECHUCO · LA PAZ</text>
  </g>
</svg>